name: Ara's Model scan

on:
  schedule:
    # Filet seulement : relance le veilleur si la chaîne a cassé. Le scheduler
    # GitHub saute ou retarde la plupart des tirs (26-29/10 : un run toutes les
    # 4 à 6 h, 10 à 50 min de retard) : c'est le veilleur qui tient l'heure.
    # Un tir qui tombe pendant qu'un veilleur tourne attend dans la file, puis
    # le relais suivant le remplace (un seul run en attente par groupe).
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "watch = veilleur (normal), scan = un scan, test = message de test Telegram"
        type: choice
        options: [watch, scan, test]
        default: watch
      minutes:
        description: "durée du veilleur en minutes (test : plus court)"
        default: "330"

concurrency:
  group: ara-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355       # job GitHub : 6 h max ; veilleur 330 min + dernière clôture
    permissions:
      contents: write          # commit de keepalive
      actions: write           # relance du veilleur suivant
    steps:
      - uses: actions/checkout@v4

      # GitHub désactive les crons d'un repo public après 60 jours sans
      # activité : un commit automatique si le dernier date de plus de 30 jours.
      - name: Garder le cron actif
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            date -u +%F > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "keepalive : garde le cron actif"
            git push
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restaurer l'anti-doublon
        uses: actions/cache/restore@v4
        with:
          path: state
          key: ara-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ara-state-

      - name: Bot
        id: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARA_MAX_LEAD_MIN: "20"
          ARA_WATCH_MAX_MIN: ${{ inputs.minutes || '330' }}
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          case "${{ inputs.mode || 'watch' }}" in
            test) python ara_bot.py --test ;;
            scan) python ara_bot.py ;;
            *)    python ara_bot.py --watch ;;
          esac

      - name: Sauver l'anti-doublon
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: ara-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Relais : le veilleur suivant part dès que celui-ci se termine (la file
      # de concurrence le retient jusque-là). Pas de relance après un échec
      # rapide, pour ne pas boucler : le cron de filet réessaiera.
      - name: Relancer le veilleur
        if: always() && (inputs.mode || 'watch') == 'watch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start="${{ steps.bot.outputs.start }}"
          if [ -z "$start" ]; then
            echo "le bot n'a pas démarré : pas de relance, le cron de filet réessaiera"
            exit 0
          fi
          elapsed=$(( $(date +%s) - start ))
          if [ "${{ steps.bot.outcome }}" != "success" ] && [ "$elapsed" -lt 600 ]; then
            echo "échec après ${elapsed}s : pas de relance, le cron de filet réessaiera"
            exit 0
          fi
          gh workflow run ara.yml --repo "$GITHUB_REPOSITORY" -f mode=watch
          echo "veilleur suivant lancé"
