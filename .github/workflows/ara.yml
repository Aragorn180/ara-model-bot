name: Ara's Model scan

on:
  schedule:
    # Un tir à :59, une minute avant chaque clôture de Q2 (hh:00 pour DXY et
    # BTC, hh:01 pour GU / EU chez IC Markets). Le script attend la clôture puis
    # la bougie, et envoie. Heures UTC générées depuis is_q2_close() pour
    # l'heure d'été ET l'heure d'hiver : le tir de la mauvaise saison sort tout
    # de suite. Si GitHub démarre le run en retard, il scanne quand même et le
    # message dit de combien de minutes.
    - cron: "59 1,5,9,13,17,21,22,23 * * 0"
    - cron: "59 0,1,2,3,5,6,7,9,10,11,13,14,15,17,18,19,21,22,23 * * 1"
    - cron: "59 * * * 2-4"
    - cron: "59 0-21 * * 5"
    - cron: "59 1,5,9,13,17,21 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = run normal, test = message de test Telegram"
        type: choice
        options: [scan, test]
        default: scan

concurrency:
  group: ara-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restaurer l'anti-doublon
        uses: actions/cache/restore@v4
        with:
          path: state
          key: ara-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ara-state-

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARA_MAX_LEAD_MIN: "15"
        run: |
          if [ "${{ inputs.mode }}" = "test" ]; then
            python ara_bot.py --test
          else
            python ara_bot.py
          fi

      - name: Sauver l'anti-doublon
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: ara-state-${{ github.run_id }}-${{ github.run_attempt }}
